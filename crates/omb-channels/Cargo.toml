[package]
name = "omb-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
testkit = []

[dependencies]
omb-channel-sdk = { path = "../omb-channel-sdk" }
openbot-infra = { path = "../openbot-infra" }
openbot-domain = { path = "../openbot-domain" }
serde.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
url.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
http.workspace = true

[dev-dependencies]
omb-channel-sdk = { path = "../omb-channel-sdk", features = ["testkit"] }

[[bin]]
name = "openmybot-channel-telegram"
path = "src/bin/openmybot_channel_telegram.rs"

[[bin]]
name = "openmybot-channel-feishu"
path = "src/bin/openmybot_channel_feishu.rs"

[[bin]]
name = "fake-channel-platform"
path = "src/bin/fake_channel_platform.rs"
required-features = ["testkit"]

[[test]]
name = "telegram_plugin"
required-features = ["testkit"]

[[test]]
name = "feishu_plugin"
required-features = ["testkit"]
