[package]
name = "openbot-account-bridge"
description = "Host side of the wrokbot-account-bridge/1 stdio protocol, its fixtures and a fake plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Library entry of the fake plugin, for tests here and in other crates; the binary needs stdio.
fake-plugin = ["tokio/io-std"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }

[[bin]]
name = "fake-account-bridge-plugin"
path = "src/bin/fake_account_bridge_plugin.rs"
required-features = ["fake-plugin"]

[[test]]
name = "fake_plugin"
required-features = ["fake-plugin"]
